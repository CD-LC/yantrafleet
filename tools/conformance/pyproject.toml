[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yantraconform"
version = "0.1.0"
description = "Free VDA 5050 v2.1 conformance tester for AMRs and fleet managers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Punith Nagaraju" }]
keywords = ["vda5050", "vda-5050", "agv", "amr", "conformance", "mqtt", "fleet", "robotics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Manufacturing",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
]
# Deliberately ZERO required dependencies: the whole scoring/report engine is
# stdlib-only so `yantra-conform checks`, replaying a capture and rendering a
# report all work in an empty venv. Talking to a real broker needs paho, which
# is already used elsewhere in this repo (sim, connector, ops) -- install it
# with `pip install yantraconform[mqtt]`.
dependencies = []

[project.optional-dependencies]
mqtt = ["paho-mqtt>=2.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://yantrika.ai/vda-5050-conformance-test.html"
Source = "https://github.com/CD-LC/yantrafleet/tree/main/tools/conformance"
Issues = "https://github.com/CD-LC/yantrafleet/issues"
Changelog = "https://github.com/CD-LC/yantrafleet/blob/main/CHANGELOG.md"
Security = "https://github.com/CD-LC/yantrafleet/security/policy"

[project.scripts]
yantra-conform = "yantraconform.__main__:main"

[tool.setuptools.packages.find]
include = ["yantraconform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: needs a real MQTT broker (auto-skips when none is reachable)",
]
