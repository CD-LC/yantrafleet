# Keeps pinned CI actions and Python dependencies current, and raises
# security advisories as PRs. Reviewed by a human before merge.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups: { actions: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: weekly }
  # Every Python component declares its own dependencies.
  - package-ecosystem: pip
    directories: [/copilot, /e2e, /core, /sim, /connector, /detector, /notifier, /ops, /tools/conformance]
    schedule: { interval: weekly }
    groups: { python-deps: { patterns: ["*"], update-types: [minor, patch] } }
