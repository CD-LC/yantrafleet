name: CI
on:
  push: { branches: [main] }
  pull_request:

# Least privilege: CI only ever reads the repo. A job that needs more must
# say so itself. (Default GITHUB_TOKEN permissions can be read-write.)
permissions:
  contents: read

# A newer push to the same ref supersedes the run still in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No credential may reach main. Stdlib-only scanner (scripts/secret_scan.py)
  # so there is no third-party action in the trust path; full history, because
  # a secret deleted in a later commit is still a leaked secret.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Scanner self-test
        run: pip install pytest && python -m pytest scripts -q
      - name: Scan tracked files
        run: python scripts/secret_scan.py
      - name: Scan full git history
        run: python scripts/secret_scan.py --history

  # Style/bug/security lint (ruff, incl. bandit rules) and static types (mypy).
  # Configs: ruff.toml, mypy.ini. copilot/ and ops/ still have typing debt
  # (about 16 findings), so mypy reports on them without failing the build.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install ruff mypy httpx fastapi pydantic
          pip install -e core -e sim -e connector -e detector -e notifier -e ops -e tools/conformance
      - name: ruff
        run: ruff check .
      - name: mypy (blocking)
        run: >
          mypy core/yantracore sim/yantrasim connector/yantrabridge
          detector/yantradetect notifier/yantranotify tools/conformance/yantraconform
      - name: mypy (informational)
        continue-on-error: true
        run: mypy copilot/sarathi ops/yantraops

  # Known-vulnerable dependencies in what the services actually run.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      # filelock is only a transitive dependency (litellm -> huggingface-hub ->
      # filelock). Every fix is in filelock 4.x but litellm pins filelock<4.0, so
      # upgrading would break the LLM tier. These exact advisories are waived until
      # litellm lifts the cap; anything NEW still fails this job.
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit -r copilot/requirements.txt -r e2e/requirements.txt \
            --ignore-vuln CVE-2026-112907 \
            --ignore-vuln CVE-2026-112908 \
            --ignore-vuln CVE-2026-112909 \
            --ignore-vuln CVE-2026-112910 \
            --ignore-vuln CVE-2026-112911 \
            --ignore-vuln CVE-2026-112912 \
            --ignore-vuln CVE-2026-112913 \
            --ignore-vuln CVE-2026-112915 \
            --ignore-vuln CVE-2026-112935 \
            --ignore-vuln CVE-2026-112936 \
            --ignore-vuln CVE-2026-112938 \
            --ignore-vuln CVE-2026-112939 \
            --ignore-vuln CVE-2026-112940 \
            --progress-spinner off

  # Every Python component with its own tests/ dir and pyproject.toml. Was
  # [core, sim, connector, copilot] only -- detector/notifier/ops never ran
  # here, so their 193 tests (60+64+73 in TEST-REPORT.md) were never CI
  # -enforced despite "525 tests, all green" in the README. e2e and the
  # browser suites (console/academy) need extra setup beyond this generic
  # pattern, so they're their own jobs below rather than squeezed into this
  # matrix's one-size-fits-all install step.
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        component: [core, sim, connector, copilot, detector, notifier, ops, tools/conformance]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install -e core
          if [ -f ${{ matrix.component }}/pyproject.toml ]; then pip install -e ${{ matrix.component }}; fi
          if [ -f ${{ matrix.component }}/requirements.txt ]; then pip install -r ${{ matrix.component }}/requirements.txt; fi
          if [ "${{ matrix.component }}" = connector ]; then pip install 'mcap>=1.0'; fi
          # ops tests drive the sibling packages and start the real copilot (loopback smoke, doctor)
          if [ "${{ matrix.component }}" = ops ]; then pip install -e sim -e connector -e detector -e notifier -r copilot/requirements.txt; fi
          # the conformance tests grade this repo's own simulator
          if [ "${{ matrix.component }}" = tools/conformance ]; then pip install -e sim; fi
          pip install pytest pytest-cov httpx mcap paho-mqtt
      # Coverage floors sit a little below today's measured numbers (core 96,
      # sim 95, detector 94, notifier 96, conformance 90, copilot 86,
      # connector 77 without the optional extras): they stop regressions, they
      # are not a target. ops spawns real subprocesses, so it is not measured.
      - name: Test
        run: |
          case "${{ matrix.component }}" in
            core) pkg=yantracore; floor=90 ;;
            sim) pkg=yantrasim; floor=90 ;;
            connector) pkg=yantrabridge; floor=75 ;;
            copilot) pkg=sarathi; floor=80 ;;
            detector) pkg=yantradetect; floor=90 ;;
            notifier) pkg=yantranotify; floor=90 ;;
            tools/conformance) pkg=yantraconform; floor=85 ;;
            ops) pkg=yantraops; floor=0 ;;
          esac
          cd ${{ matrix.component }} && python -m pytest tests -q --cov=$pkg --cov-report=term --cov-fail-under=$floor

  # Offline end-to-end harness (fakerest.py in-process fake PostgREST): needs
  # core + sim installed editable, copilot's own requirements.txt (sarathi is
  # imported via sys.path in the test files, not pip-installed, but its
  # runtime deps -- fastapi/httpx/pydantic/litellm/mcp -- still need to be
  # importable), and e2e's own requirements.txt on top. Never ran in CI
  # before this; 35 tests including 17 RBAC-enforcement (test_rbac_e2e.py).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install -e core -e sim -e connector -e detector -e ops
          pip install -r copilot/requirements.txt
          pip install -r e2e/requirements.txt
      - name: Test
        run: cd e2e && python -m pytest -q

  # console/ and academy/ are single-file, no-build HTML apps tested with
  # pytest-playwright (Python), not npm/jest -- the old "console" job's
  # `npm test --if-present` was always a no-op (no package.json anywhere in
  # this repo) and never actually ran either suite's 86 combined browser
  # tests. check_console.mjs / check_academy.mjs (a plain Node syntax check
  # on each HTML file's inline <script> blocks) still need Node; the actual
  # test suites need a headless Chromium via Playwright.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.pw-browsers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: '3.12' }
      - name: Inline-script syntax checks
        run: |
          node scripts/check_console.mjs
          node academy/tests/check_academy.mjs
      - name: Install Python + Playwright
        run: |
          pip install pytest playwright pytest-playwright
          python -m playwright install --with-deps chromium
      - name: Console tests
        run: cd console && python -m pytest tests -q
      - name: Academy tests
        run: cd academy && python -m pytest tests -q
